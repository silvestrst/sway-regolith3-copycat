# foot terminal themed to match the Regolith "lascaille" look (Ayu Mirage).
font=Bitstream Vera Sans Mono:size=11
pad=8x8
dpi-aware=yes

[colors]
alpha=1.0
cursor=1F2430 FFA759
background=1F2430
foreground=CBCCC6

# normal
regular0=1F2430
regular1=FF3333
regular2=BAE67E
regular3=FFD580
regular4=77A8D9
regular5=D4BFFF
regular6=95E6CB
regular7=CBCCC6

# bright
bright0=707A8C
bright1=FF3333
bright2=A6CC70
bright3=FFE6B3
bright4=73D0FF
bright5=D4BFFF
bright6=5CCFE6
bright7=FFFFFF

selection-foreground=1F2430
selection-background=FFA759

[mouse]
hide-when-typing=yes
